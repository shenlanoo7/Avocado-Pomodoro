<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Settings</title>
<style>
:root{--ink:#11152f;--paper:#fff7df;--accent:#ffc1d3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--paper);font:14px Menlo,monospace}#panel{margin:8px;width:314px;height:514px;overflow:auto;background:#202039;border:4px solid var(--paper);box-shadow:4px 4px 0 var(--ink);padding:18px}h1{font-size:18px;letter-spacing:1px;margin:0 0 20px;cursor:grab}label{display:block;margin:14px 0 7px;font-size:14px}select,button{height:36px;width:100%;font:14px Menlo,monospace;border:2px solid #a99caf;border-radius:0;background:#35354f;color:var(--paper);padding:5px 8px}button{border:3px solid var(--ink);background:var(--accent);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}select:focus-visible,button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}.hint{font-size:11px;line-height:1.5;margin:16px 0;color:#c8bed0}#done{margin-top:0}
</style>
<div id="panel"><h1 id="heading">SETTINGS</h1><div class="row"><label for="skin">Skin</label><select id="skin"><option value="avocado">Avocado</option><option value="kirby">Kirby</option></select></div><div class="row"><label for="language">Language</label><select id="language"><option value="en">English</option><option value="zh">简体中文</option></select></div><div class="row"><label for="sound">Completion sound</label><button id="sound" aria-pressed="true">On</button></div><label for="prompts">Focus prompts</label><textarea id="prompts" maxlength="50000" placeholder="One prompt per line"></textarea><p class="hint">One prompt per line. Changes save automatically.<br>Choose focus minutes on Start.<br>At the bell, choose Rest or Keep Going.</p><button id="done">Done</button></div>
<style>#panel{padding:14px}h1{margin-bottom:14px}.row{display:flex;align-items:center;gap:8px;margin:10px 0}.row label{flex:1;margin:0;font-size:14px}.row select{width:116px}.row button,.row input{width:76px}.row input{height:36px;font:14px Menlo,monospace;color:var(--paper);background:#35354f;border:2px solid #a99caf;border-radius:0;padding:5px 8px;user-select:text}.row input:focus-visible{outline:2px solid var(--paper);outline-offset:2px}.hint{font-size:10px;margin:12px 0;line-height:1.5}textarea{width:100%;height:118px;resize:none;border:2px solid #a99caf;border-radius:0;background:#35354f;color:var(--paper);padding:8px;font:12px Menlo,'PingFang SC',monospace;user-select:text}textarea:focus{outline:2px solid var(--paper);outline-offset:2px}
</style>
<script src="i18n.js"></script><script>
const $=id=>document.getElementById(id);let muted=false;
function renderLanguage(){ $('language').value=uiLanguage();$('sound').textContent=t(muted?'Off':'On'); }
document.addEventListener('languagechange',renderLanguage);renderLanguage();
$('language').onchange=()=>{applyLanguage($('language').value);native('setLanguage',{language:uiLanguage()});};
function native(action,extra={}){window.webkit?.messageHandlers?.native?.postMessage({action,...extra});}
window.applyPreferences=p=>{if(p.language)applyLanguage(p.language);$('skin').value=p.skin;if(Array.isArray(p.prompts)&&document.activeElement!==$('prompts'))$('prompts').value=p.prompts.join('\n');muted=!!p.muted;$('sound').textContent=t(muted?'Off':'On');$('sound').setAttribute('aria-pressed',String(!muted));};
$('prompts').oninput=()=>native('setPrompts',{prompts:$('prompts').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>s.slice(0,2000)).slice(0,500)});
$('skin').onchange=()=>native('setSkin',{skin:$('skin').value});$('sound').onclick=()=>{muted=!muted;$('sound').textContent=t(muted?'Off':'On');$('sound').setAttribute('aria-pressed',String(!muted));native('setMuted',{muted});};$('done').onclick=()=>native('settingsClose');document.addEventListener('keydown',e=>{if(e.key==='Escape')native('settingsClose');});$('heading').onmousedown=e=>{if(e.button===0)native('settingsDrag');};native('settingsReady');
</script></html>
