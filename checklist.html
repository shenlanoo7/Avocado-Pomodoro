<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidian Checklist</title>
<style>
:root{--ink:#252322;--paper:#f8eee0;--accent:#ad5e59;--muted:#7d746d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--ink);font:13px Menlo,'PingFang SC',monospace}#paper{position:absolute;inset:10px 20px 20px 10px;background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 #8d8270;display:flex;flex-direction:column;padding:23px 20px 16px}header{cursor:grab;user-select:none}h1{font-size:14px;letter-spacing:1.7px;margin:0;text-align:center;line-height:1.5}h1::before,h1::after{content:' ··· ';color:var(--accent)}#vaultLabel{font-size:10px;color:var(--muted);text-align:center;margin:8px 0 14px}#hide{position:absolute;right:1px;top:26px;width:25px;height:34px;background:var(--accent);border:3px solid var(--ink);color:var(--paper);font-size:18px;box-shadow:2px 2px 0 #615a4b;z-index:2;cursor:pointer}.tools{display:flex;gap:6px;border-top:2px dotted var(--accent);padding-top:12px}select,button,input{font:inherit}select{min-width:0;background:transparent;color:var(--ink);border:1px solid #aa9d90;height:30px;border-radius:0;padding:3px}#note{flex:1;width:200px}#filter{width:72px}#refresh{height:30px;width:30px;background:var(--paper);border:1px solid #aa9d90;cursor:pointer;font-size:18px}select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:5px;margin-top:6px}#list::-webkit-scrollbar{width:6px}#list::-webkit-scrollbar-thumb{background:#c5b2a2}.group{margin-top:18px}.group h2{font-size:11px;font-weight:bold;letter-spacing:1px;color:var(--accent);border-top:1px dotted #aa9d90;padding-top:12px;margin:0 0 10px;text-transform:uppercase;overflow-wrap:anywhere}.notePath{font-size:10px;color:var(--muted);letter-spacing:0;display:block;margin-bottom:6px;text-transform:none}.taskRow{display:flex;align-items:flex-start;gap:10px;padding:6px 0;line-height:1.55;cursor:pointer;overflow-wrap:anywhere}.taskRow input{appearance:none;-webkit-appearance:none;margin:3px 0 0;flex:0 0 17px;width:17px;height:17px;background:transparent;border:2px solid var(--ink);border-radius:0;box-shadow:1px 1px 0 #b9ab98;cursor:pointer}.taskRow input:checked{background:var(--accent);box-shadow:inset 2px 2px 0 #d98b7e,1px 1px 0 #b9ab98}.taskRow input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.taskRow.done .taskText{text-decoration:line-through;text-decoration-thickness:1px;color:#93877c}.taskRow.pending{opacity:.6}.taskRow input:disabled{cursor:wait}.taskText{flex:1;min-width:0}#status{border-top:1px dotted #b4a28e;font-size:10px;color:var(--muted);line-height:1.5;margin-top:12px;padding-top:10px;overflow-wrap:anywhere}#status.error{color:#a63d39}#empty{color:var(--muted);font-size:12px;line-height:1.7;margin-top:40px;text-align:center}.binding{position:absolute;bottom:0;left:0;right:10px;height:14px;background:#575048;border:4px solid var(--ink);box-shadow:inset 0 2px #a69681}
.taskRow{margin-left:var(--task-indent,0px)}.taskText{min-width:0}.taskText a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}.taskText a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div id="paper"><header id="heading"><h1 id="title">CHECKLIST</h1><div id="vaultLabel">Obsidian · shenlan-lib</div></header><div class="tools"><select id="note" aria-label="Note"><option value="all">All notes</option></select><select id="filter" aria-label="Task filter"><option value="all">All</option><option value="open">Open</option><option value="done">Done</option></select><button id="refresh" aria-label="Refresh" title="Refresh">↻</button></div><main id="list"><p id="empty">Loading tasks from Obsidian…</p></main><div id="status" role="status">Reading vault…</div></div><button id="hide" title="Hide checklist" aria-label="Hide checklist">−</button><div class="binding"></div>
<script src="i18n.js"></script><script>
const $=id=>document.getElementById(id);let tasks=[],busy=false,loaded=false,pending=null,lastSignature='',requestSequence=0;
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function native(action,extra={}){window.webkit?.messageHandlers?.native?.postMessage({action,...extra});}
function requestTasks(){if(busy)return;native('loadTasks',{requestId:++requestSequence});}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function taskDepths(){
  const depths=new Map();let stack=[],group=null;
  for(const task of tasks){
    const key=task.path+'\n'+task.heading;if(key!==group){stack=[];group=key;}
    let columns=0;for(const c of (task.rawLine||'').match(/^[ \t]*/)[0])columns=c==='\t'?columns+4-columns%4:columns+1;
    while(stack.length&&stack[stack.length-1]>=columns)stack.pop();
    depths.set(task.path+'\n'+task.line,stack.length);stack.push(columns);
  }
  return depths;
}
function renderTaskText(container,value){
  // Create DOM nodes, never HTML from vault contents. Preserve unsupported syntax literally.
  const links=/\[([^\]\n]+)\]\((https?:\/\/(?:[^()\s]|\([^()\s]*\))+)\)/g;
  let offset=0;
  for(const match of value.matchAll(links)){
    let url;try{url=new URL(match[2]);}catch{continue;}
    if(!['http:','https:'].includes(url.protocol)||!url.hostname)continue;
    container.append(document.createTextNode(value.slice(offset,match.index)));
    const link=document.createElement('a');link.textContent=match[1];link.href=url.href;link.title=url.href;
    link.onclick=e=>{e.preventDefault();e.stopPropagation();native('openTaskLink',{url:url.href});};
    container.append(link);offset=match.index+match[0].length;
  }
  container.append(document.createTextNode(value.slice(offset)));
}
function render(){const selected=$('note').value,filter=$('filter').value;const visible=tasks.filter(t=>(selected==='all'||selected===t.path)&&(filter==='all'||(filter==='done')===t.checked));const depths=taskDepths();const scrollTop=$('list').scrollTop;$('list').replaceChildren();$('title').textContent=selected==='all'?t('CHECKLIST'):selected.split('/').pop().replace(/\.md$/i,'');const groups=new Map();for(const t of visible){const key=t.path+'\n'+t.heading;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t);}for(const [key,rows] of groups){const section=document.createElement('section');section.className='group';const h=document.createElement('h2');const path=document.createElement('span');path.className='notePath';path.textContent=rows[0].path;h.append(path,document.createTextNode(rows[0].heading||t('TASKS')));section.append(h);for(const t of rows){const label=document.createElement('label');label.className='taskRow'+(t.checked?' done':'');label.style.setProperty('--task-indent',Math.min(depths.get(t.path+'\n'+t.line)||0,6)*18+'px');const check=document.createElement('input');check.type='checkbox';check.checked=t.checked;check.disabled=busy;check.setAttribute('aria-label',t.text);const text=document.createElement('span');text.className='taskText';renderTaskText(text,t.text);check.onchange=()=>{if(busy)return;check.checked=t.checked;busy=true;pending={path:t.path,line:t.line,requestId:requestSequence+1};label.classList.add('pending');$('list').querySelectorAll('input').forEach(i=>i.disabled=true);status(window.t('Saving to Obsidian…'));native('toggleTask',{path:t.path,line:t.line,expectedLine:t.rawLine,checked:!t.checked,requestId:++requestSequence});};label.append(check,text);section.append(label);} $('list').append(section);}if(!visible.length){const p=document.createElement('p');p.id='empty';p.textContent=t(tasks.length?'No tasks match this view.':'No Markdown tasks found.');$('list').append(p);}$('list').scrollTop=scrollTop;return visible.length;}
window.receiveTasks=result=>{if(pending&&result.requestId&&result.requestId<pending.requestId)return;if(!result.ok){busy=false;pending=null;render();status(result.error||t('Unable to sync. Refresh and retry.'),true);return;}tasks=result.tasks||[];const paths=[...new Set(tasks.map(t=>t.path))].sort();let selected=$('note').value;if(!loaded){selected=localStorage.getItem('checklist.note')||paths.find(p=>p===today()+'.md'||p.endsWith('/'+today()+'.md'))||'all';$('filter').value=localStorage.getItem('checklist.filter')||'all';}if(selected!=='all'&&!paths.includes(selected))selected='all';const options=[new Option(t('All notes'),'all'),...paths.map(p=>new Option(p.replace(/\.md$/i,''),p))];if(!loaded||JSON.stringify([...$('note').options].map(o=>o.value))!==JSON.stringify(['all',...paths]))$('note').replaceChildren(...options);$('note').value=selected;const signature=JSON.stringify([tasks,selected,$('filter').value]);const needsRender=busy||signature!==lastSignature;busy=false;pending=null;loaded=true;lastSignature=signature;const count=needsRender?render():$('list').querySelectorAll('.taskRow').length;status(t('{count} / {total} tasks · Synced {time}',{count,total:tasks.length,time:new Date().toLocaleTimeString(uiLanguage()==='zh'?'zh-CN':'en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}));};
$('note').onchange=()=>{localStorage.setItem('checklist.note',$('note').value);render();};$('filter').onchange=()=>{localStorage.setItem('checklist.filter',$('filter').value);render();};$('refresh').onclick=requestTasks;$('hide').onclick=()=>native('checklistClose');document.addEventListener('keydown',e=>{if(e.key==='Escape')native('checklistClose');});$('heading').onmousedown=e=>{if(e.button===0)native('checklistDrag');};document.addEventListener('languagechange',()=>{const all=$('note').querySelector('option[value=all]');if(all)all.textContent=t('All notes');if(loaded){const count=render();status(t('{count} / {total} tasks · Synced {time}',{count,total:tasks.length,time:new Date().toLocaleTimeString(uiLanguage()==='zh'?'zh-CN':'en-GB',{hour12:false})}));}else {$('empty').textContent=t('Loading tasks from Obsidian…');status(t('Reading vault…'));}});native('languageReady');setInterval(requestTasks,3000);native('checklistReady');
</script></html>
